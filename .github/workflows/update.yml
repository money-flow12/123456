name: Auto-refresh dataset
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install pandas yfinance finvizfinance tqdm
      - name: Run script
        run: python build_dataset.py
      - name: Commit & push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto data refresh"
          branch: main
          file_pattern: |
            high_growth_turnaround_us_stocks.csv
            high_growth_turnaround_us_stocks.xlsx
